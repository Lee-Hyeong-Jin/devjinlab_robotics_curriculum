[project]
name = "robotics-curriculum"
version = "0.1.0"
description = "Robotics expert-course curriculum and learning-assist platform: Markdown/YAML content, progress tracking, reports, and a static study site."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "robotics-curriculum contributors" }]
requires-python = ">=3.12"
keywords = ["robotics", "curriculum", "education", "learning", "spaced-repetition", "mkdocs", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Natural Language :: Korean",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "pyyaml>=6",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.1",
    "pymdown-extensions>=13.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "sqlalchemy>=2.0",
]

postgres = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[project.scripts]
rc = "robotics_curriculum.cli:app"

[dependency-groups]
dev = [
    "alembic>=1.13",
    "robotics-curriculum[api]",
    "httpx>=0.27",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "sqlalchemy>=2.0",
    "testcontainers[postgres]>=4",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robotics_curriculum"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
source = ["robotics_curriculum"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
