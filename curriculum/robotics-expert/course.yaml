id: robotics-expert
title: 로보틱스 전문가 코스
summary: >-
  기초→중급→고급의 단계적 경로로 로보틱스 전문가를 기르는 단일 코스(10개 모듈).
  기초(M1–M4): 수학·물리, 로봇 운동학, 이동 로봇·제어, 센서·인식 기초.
  중급(M8, M5–M7): ROS 2·도구 개요로 시작해 상태 추정·SLAM, 내비게이션·경로 계획, 매니퓰레이션·동작 계획.
  고급(M9–M10): 학습 기반 로보틱스, 시스템 통합·캡스톤 프로젝트.
  권장 순서는 M1→M2→M3→M4→M8→M5→M6→M7→M9→M10 이다.
tags: [robotics, fundamentals]
modules:
  - m1-math-physics
  - m2-kinematics
  - m3-mobile-robots-control
  - m4-sensors-perception
  - m8-ros2-tools
  - m5-state-estimation-slam
  - m6-navigation-planning
  - m7-manipulation-motion-planning
  - m9-learning-based-robotics
  - m10-system-integration-capstone
# 목표별 학습 경로: 목표에 닿는 레슨(targets)과 그 선수 레슨만 모은 경로를 만든다.
goals:
  - id: mobile-robot
    title: 움직이는 로봇 제어하기
    summary: 바퀴 로봇의 운동 모델을 세우고 PID 로 경로를 따라가게 한다. 가장 짧은 경로로, 첫 로봇을 움직이는 데 필요한 것만 담았다.
    targets: [m3-path-following]
  - id: slam
    title: 지도를 만들고 위치 추정하기 (SLAM)
    summary: 센서 모델과 필터에서 시작해 EKF·파티클 필터·점유 격자를 거쳐 그래프 SLAM 까지 간다.
    targets: [m5-graph-slam-slam-toolbox]
  - id: navigation
    title: 자율주행 (내비게이션)
    summary: 지도 위에서 경로를 계획하고 장애물을 피해 목적지까지 가는 로봇. 위치 추정과 Nav2 구조까지 포함한다.
    targets: [m6-nav2-architecture-behavior-trees]
  - id: manipulation
    title: 로봇 팔 (매니퓰레이션)
    summary: 운동학·자코비안·동역학에서 궤적 생성, 파지, 동작 계획과 MoveIt 2 구조까지.
    targets: [m7-moveit2-reading]
  - id: robot-learning
    title: 로봇 러닝
    summary: 강화학습·모방학습·sim-to-real 에서 VLA 파운데이션 모델과 평가 방법까지, 그에 필요한 기초만 골라 간다.
    targets: [m9-datasets-benchmarks-evaluation]
