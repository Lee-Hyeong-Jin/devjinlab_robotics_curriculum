id: m4-sensors-perception
title: M4 센서·인식 기초
summary: 로봇 센서의 원리와 노이즈·관측 모델, 기본 필터링, 카메라 모델과 이미지 특징, 점군 처리(RANSAC·ICP), 딥러닝 기반 객체 인식의 입구를 다룬다.
outcome: >-
  센서 값에 섞인 잡음을 모델로 다루고, 카메라 영상과 점군에서 로봇에 필요한 기하 정보를 뽑아낼 수 있다.
level: 기초
lessons:
  - sensor-models
  - filtering-basics
  - camera-model-features
  - point-clouds-icp-ransac
  - object-detection-intro
