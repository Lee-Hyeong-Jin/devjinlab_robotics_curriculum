title: "M3 Mobile robots and control"
summary: >-
  The kinematic model of a differential-drive robot, PID feedback control, and controllers
  for reaching a goal point and following a path.
outcome: >-
  predict how a differential-drive robot moves from its wheel speeds, and tune a PID
