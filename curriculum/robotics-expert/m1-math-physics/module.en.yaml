id: m1-math-physics
lang: en
title: "M1 Maths and physics foundations"
summary: >-
  The mathematical tools needed to describe a robot: vectors and matrices, rotation
  representations, and coordinate transforms.
outcome: >-
  compute positions and orientations with vectors and matrices, and move a point seen in one
  coordinate frame into another — for example, an object a camera sees into the robot's base
  frame.
