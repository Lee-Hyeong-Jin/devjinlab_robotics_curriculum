id: m5-state-estimation-slam
title: M5 상태 추정·SLAM
summary: >-
  확률로 로봇의 위치를 표현하는 베이즈 필터에서 출발해 칼만 필터·EKF, 파티클 필터와 몬테카를로 로컬라이제이션,
  휠 오도메트리와 IMU 의 센서 융합, 점유 격자 지도와 스캔 매칭, 그래프 SLAM 과 SLAM Toolbox 읽기까지
  numpy 예제 중심으로 다룬다. M6 내비게이션의 지도·위치 추정이 이 모듈을 기반으로 한다.
level: 중급
lessons:
  - bayes-filter
  - kalman-filter-ekf
  - particle-filter-mcl
  - odometry-sensor-fusion
  - occupancy-grid-scan-matching
  - graph-slam-slam-toolbox
