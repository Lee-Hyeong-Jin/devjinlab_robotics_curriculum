  "Modern Robotics Ch. 11 Robot Control 영상":
    title: "Modern Robotics ch. 11, Robot Control (videos)"
    note: "Chapter 11, 13 videos, 57:51."
  "Coursera Modern Robotics Specialization":
    note: >-
      Course 3, Robot Dynamics (chapters 8-9). A Korean edition exists as
      modernrobotics-course3-ko. Free to audit.
