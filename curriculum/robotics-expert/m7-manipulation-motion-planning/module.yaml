id: m7-manipulation-motion-planning
title: M7 매니퓰레이션·동작 계획
summary: >-
  M2 의 기구학을 속도·힘으로 넓혀 자코비안과 특이점, 라그랑지안 동역학과 계산 토크 제어,
  관절·작업 공간 궤적 생성(3차·5차 다항식, 속도·가속도 제한)을 numpy 예제로 구현하고,
  파지·접촉과 임피던스 제어, 구성공간 장애물과 샘플링 기반 매니퓰레이터 동작 계획을 거쳐
  MoveIt 2 의 move_group·플래닝 씬·OMPL·ros2_control 구조를 읽는다.
  M6 의 샘플링 기반 계획과 M8 의 tf2·URDF 를 기반으로 하며, M9 의 학습 기반 매니퓰레이션으로 이어진다.
level: 중급
lessons:
  - jacobian-singularity
  - manipulator-dynamics-torque-control
  - trajectory-generation
  - grasping-impedance-control
  - manipulator-motion-planning
  - moveit2-reading
