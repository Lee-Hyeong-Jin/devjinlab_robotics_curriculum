id: m10-system-integration-capstone
title: M10 시스템 통합·캡스톤 프로젝트
summary: >-
  요구사항에서 컴포넌트·인터페이스로 내려가는 시스템 설계, 센서·액추에이터·컴퓨팅·전원·통신을 고르는 하드웨어 통합,
  워치독·페일세이프·기능 안전 개요, 단위·통합·HIL 테스트와 컨테이너·로깅을 묶은 CI·배포를 다룬 뒤,
  시뮬레이터 없이 저가 실하드웨어나 데이터셋으로 수행하는 캡스톤 프로젝트를 설계·평가하고
  포트폴리오·커뮤니티·대회·채용으로 연결한다. M1–M8 에서 익힌 부품을 하나의 동작하는 시스템으로 엮는 마지막 모듈이다.
level: 고급
lessons:
  - system-architecture-requirements
  - hardware-selection-integration
  - realtime-safety-reliability
  - testing-ci-deployment
  - capstone-project-guide
  - career-community-portfolio
