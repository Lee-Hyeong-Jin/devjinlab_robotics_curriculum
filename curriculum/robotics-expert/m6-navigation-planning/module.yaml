id: m6-navigation-planning
title: M6 내비게이션·경로 계획
summary: >-
  구성공간과 격자 그래프 탐색(Dijkstra·A*)에서 출발해 샘플링 기반 계획(PRM·RRT·RRT*),
  비용 지도와 전역 계획, 지역 계획과 장애물 회피(DWA·MPPI), 경로 평활화와 궤적 생성까지 numpy 예제로 구현하고,
  마지막으로 이 부품들이 Nav2 의 서버·플러그인과 행동 트리로 어떻게 엮이는지 읽는다.
  M5 의 지도·위치 추정과 M8 의 tf2 를 기반으로 하며, M7 의 동작 계획이 이 모듈의 샘플링 기반 계획을 이어받는다.
level: 중급
lessons:
  - configuration-space-graph-search
  - sampling-based-planning
  - costmap-global-planning
  - local-planning-dwa-mppi
  - path-smoothing-trajectory
  - nav2-architecture-behavior-trees
