id: m8-ros2-tools
title: M8 ROS 2·도구 개요
summary: >-
  ROS 2 Jazzy(Ubuntu 24.04) 기준으로 계산 그래프 개념과 배포판 선택, 노드·토픽·서비스·액션·파라미터·launch 프로그래밍,
  tf2·URDF·RViz·rosbag2(MCAP)·Foxglove 같은 핵심 도구, ros2_control·Nav2·MoveIt 2·micro-ROS 상위 스택과 개발 환경,
  레퍼런스 로봇 코드 읽기를 읽기 중심으로 다룬다. M5·M6·M7 의 ROS 2 레슨이 이 모듈을 선수지식으로 쓴다.
