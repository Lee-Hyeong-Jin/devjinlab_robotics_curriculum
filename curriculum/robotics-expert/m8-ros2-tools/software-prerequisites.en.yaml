id: m8-software-prerequisites
lang: en
activities:
  m8-software-prerequisites-reading: Read the checklist and pick the areas you are short on
  m8-software-prerequisites-quiz: "Quiz: reading shell, build and network symptoms"
  m8-software-prerequisites-exercise: A five-minute self-test in the terminal
resources:
  "The Missing Semester of Your CS Education (MIT)":
    note: >-
      Lectures on the shell, shell scripting, the command-line environment and Git. Videos
      and notes are free.
  "Pro Git (Scott Chacon, Ben Straub)":
    note: "Chapters 1–3 (getting started, basics, branching) are enough. Free; the English edition is at https://git-scm.com/book/en/v2"
  "CMake Tutorial":
    note: "Steps 1–2 are enough to read a CMakeLists.txt that builds an executable and a library."
  "ament_cmake user documentation (ROS 2 Jazzy)":
    note: >-
      Where the CMakeLists.txt of a ROS 2 package differs from plain CMake (find_package,
      ament_target_dependencies, install).
  "Python Packaging User Guide":
    note: >-
      pip, virtual environments and where packages are installed. Read it before the
      ament_python packages of ROS 2.
  "About domain ID (ROS 2 Jazzy)":
    note: >-
      ROS_DOMAIN_ID and the UDP ports DDS uses: the background for nodes that do not see
      each other.
  "Docker networking overview":
    note: "The difference between the bridge network a container is put on by default and the host network."
quiz:
  - id: q1
    prompt: >-
      After running `bash /opt/ros/jazzy/setup.bash`, the shell still says there is no `ros2`
      command. Why?
    choices:
      - The script ran in a child shell, so the changed environment variables did not stay in this shell
      - ROS 2 is not installed
      - '`ROS_DOMAIN_ID` is not set'
      - It was not run with administrator rights
    explanation: >-
      `bash file` starts a new shell, runs the file there, and that shell's environment is
      gone when it ends. To keep the variables in the current shell use `source file` (or
      `. file`). It is all the more confusing because nothing reports an error.
    concept:
      front: '`source` versus running with `bash`'
      back: >-
        `source` runs in the current shell and the variables stay; `bash file` runs in a
        child shell and they are lost
  - id: q2
    prompt: >-
      `colcon build` stops with `Could not find a package configuration file provided by
      "nav2_msgs"`. What do you do first?
    choices:
      - 'Fix the `#include` lines in the C++ source'
      - 'Install the dependencies with `rosdep install` and check that the workspace you need is sourced'
      - 'Add a library to `target_link_libraries`'
      - Restart the computer
    explanation: >-
      This message comes before any compiling, in the CMake configure step: `find_package`
      did not find the package. Either it is not installed or the place it is installed in
      is not sourced, so this is not yet the time to look at source code or link settings.
    concept:
      front: 'What CMake means by `Could not find a package configuration file`'
      back: >-
        The package was not found at configure time - check installation (`rosdep install`)
        and sourcing
  - id: q3
    prompt: >-
      Two containers started from different Compose projects on the same PC discover each
      other's ROS 2 nodes without any further setup.
    explanation: >-
      Each Compose project creates a virtual network of its own. DDS discovery by multicast
      only reaches within one network, so the two containers do not find each other. Put
      them on the same network (one Compose file) or, on Linux, use the host network.
    concept:
      front: Why ROS 2 nodes in different containers do not see each other
      back: >-
        They are on different virtual networks, which multicast discovery does not cross -
        share a network or use the host network
