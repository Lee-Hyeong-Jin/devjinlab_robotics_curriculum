  s2-generative-policies-papers: Read the three must-read papers and write a one-page note on each
  s2-generative-policies-problems: >-
    Problem set (2 derivations, 2 proofs, 2 numerical, 1 implementation, 1 counterexample)
  s2-generative-policies-reproduction: >-
    Reproduction task - mode collapse versus score sampling, and the optimal chunk length (R2)
  s2-generative-policies-quiz: Concept-check quiz
resources:
  "numpy (ODE 적분과 해석적 점수)":
    title: numpy (ODE integration and the analytic score)
    note: >-
