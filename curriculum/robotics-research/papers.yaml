# 연구원 트랙 코스 논문 서지 (course paper registry) — ADR 0014
#
# 이 파일은 **서지(bibliography)** 다: 누가 무엇을 어디에 썼고 링크를 확인했는지.
# "어떤 논문을 필독으로 지정하는가"는 레슨의 결정이며 레슨 front matter 의 `papers[]` 가 원본이다.
# 레슨 참조의 `role`·`note` 가 여기 값을 덮어쓰고, `required` 는 레슨에만 있다.
# 형식·검증 규칙: docs/adr/0014-paper-registry.md, docs/curriculum/CONTENT_MODEL.md "papers.yaml".
#
# 필드: id · title · authors[] · year · venue · url · verified · role · note
#   verified : 링크를 실제로 열어 제목·제1저자·연도가 맞는지 확인했는가. false 는 사이트에서
#              "(미확인)" 배지로 표시된다.
#   role     : seminal | standard | frontier | critique | survey (레슨이 덮어쓸 수 있는 기본값)
#
# 선택 필드 `lessons[]`(역색인)는 **이 레지스트리에 쓰지 않는다.** 두 가지 이유다: ① 어느 레슨이
# 어떤 논문을 지정하는지는 레슨의 papers[] 가 원본이고 역색인은 즉시 어긋난다(rc validate 가
# 불일치를 경고한다) ② 여러 모듈이 공유하는 논문에 자기 레슨을 적으려면 **남의 모듈 블록을
# 고쳐야** 해서 저자 경계와 충돌한다. 공유 논문은 id 만 재사용하고 자기 레슨의 papers[] 에만 쓴다.
# 어느 레슨이 어떤 논문을 왜 지정하는지의 설계 기록은 연구 트랙 설계 노트의 blueprint "필독" 열에 있다.
#
# ── 저자 경계 (AUTHORING §9-1) ─────────────────────────────────────────────────
# 각 저자는 **자기 모듈 블록 안에서만** 추가·수정한다. 다른 모듈 항목은 읽기 전용이며,
# 같은 논문을 쓰려면 **id 를 재사용**하고 그 항목의 lessons[] 에 자기 레슨 id 만 더한다.
# 블록이 없으면 아래 구분선 형식으로 자기 모듈 블록을 만든다. 헤더(이 주석)는 공유 구역이므로
# 건드리지 않는다 — 편수는 하드코딩하지 않고 필요할 때 센다:
#   grep -c '^  - id:' curriculum/robotics-research/papers.yaml
#   grep -c 'verified: false' curriculum/robotics-research/papers.yaml
#
# URL 확인 방법: arXiv API(id_list), Crossref API, OpenAlex, 학회 프로시딩 페이지
# (papers.nips.cc, ijcai.org, cdn.aaai.org), 저자·연구실 페이지. DOI 로만 확인한 항목은
# 제목·제1저자·연도까지 대조했고 전체 저자 목록은 대조하지 않았다. arXiv 로 확인한 항목의
# 게재 venue 는 journal_ref 가 없으면 확인되지 않았으며 그런 항목은 note 에 적었다.
# 끝내 확인되지 않는 항목은 목록에서 빼고 대체 논문을 넣는다.
#
# ── 항목은 레슨과 **함께** 추가한다 ───────────────────────────────────────────
# `tests/test_content.py::test_live_curriculum_validates` 와 `rc validate` 의 CLI 테스트는
# `validate_course(course) == []` 을 요구한다 — **경고도 실패다.** 그리고 "레지스트리에 있는데
# 아무 레슨도 참조하지 않는 논문"은 경고다. 따라서 **아직 쓰지 않은 레슨을 위해 논문을 미리
# 넣으면 게이트가 깨진다.** 항목은 그것을 참조하는 레슨과 같은 커밋에 추가한다.
# 설계 단계의 전체 서지(145편, 레슨별 지정 의도 포함)는 연구 트랙 설계 노트의 papers.yaml 과
# blueprint 의 "필독" 열에 있다 — 거기서 자기 모듈 몫을 가져와 이 파일에 옮긴다.

