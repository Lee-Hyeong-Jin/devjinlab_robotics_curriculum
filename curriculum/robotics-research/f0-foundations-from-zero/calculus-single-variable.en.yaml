quiz:
  - id: q1
    prompt: >-
      Write the derivative of $f(x) = x^3 e^{2x}$ with $e^{2x}$ factored out, as
      $f'(x) = (ax^2 + bx^3)e^{2x}$. What are $a$ and $b$? (comma separated)
    explanation: >-
      By the product rule $f' = 3x^2e^{2x} + x^3\cdot 2e^{2x} = (3x^2 + 2x^3)e^{2x}$, so $a=3$ and $b=2$.
    answers: ["3, 2", "3,2", "a=3, b=2", "3 2"]
    concept:
      front: The product rule
      back: $(uv)' = u'v + uv'$ - with an exponential involved, collect the common factor
  - id: q2
    prompt: What is the value of $\int_0^1 x\,e^{x}\,dx$?
    choices: ["$e - 1$", "$1$", "$e$", "$e - 2$"]
    explanation: >-
      By parts, $\int xe^x dx = xe^x - e^x$, so $[xe^x - e^x]_0^1 = (e - e) - (0 - 1) = 1$.
    concept:
      front: Integration by parts
      back: $\int u\,dv = uv - \int v\,du$ - used for polynomial times exponential or trigonometric
  - id: q3
    prompt: The Taylor expansion of $\sin x$ at $x=0$ to third order is $x - x^3/k$. What is $k$?
    explanation: >-
      $\sin x = x - x^3/3! + x^5/5! - \cdots$, so $k = 3! = 6$. Expansions like Rodrigues' formula
      in the core modules use this series.
    answers: ["6", "3!", "six"]
    concept:
      front: The Taylor series of $\sin x$
      back: $x - x^3/3! + x^5/5! - \cdots$ (odd powers only, alternating signs)
  - id: q4
    prompt: At which $x$ does $f(x) = x^3 - 3x$ attain a local minimum?
    choices: ["$x = -1$", "$x = 0$", "$x = 1$", "It has no local minimum"]
    explanation: >-
      $f' = 3x^2 - 3 = 0$ gives $x = \pm1$. With $f'' = 6x$, $f''(1) = 6 > 0$ (local minimum) and
      $f''(-1) = -6 < 0$ (local maximum).
    concept:
      front: Classifying critical points
      back: Where $f'=0$, $f''>0$ means a local minimum and $f''<0$ a local maximum
  - id: q5
    prompt: A function continuous on an interval is differentiable on that interval.
    explanation: >-
      $f(x)=|x|$ is continuous everywhere but not differentiable at $x=0$. Differentiable implies
      continuous, not the converse. This distinction matters later in non-smooth optimization
      (contact dynamics).
    concept:
      front: Continuity versus differentiability
      back: Differentiable implies continuous; the converse is false ($|x|$ is the counterexample)
  - id: q6
    prompt: What is $\lim_{x\to 0} \frac{\sin x}{x}$?
    explanation: >-
      Dividing the Taylor expansion $\sin x = x - x^3/6 + \cdots$ by $x$ gives
      $1 - x^2/6 + \cdots \to 1$. This limit is why $\sin\theta/\theta$ is replaced by its series
      at small angles later on.
    answers: ["1", "one", "1.0"]
    concept:
      front: The limit of $\sin x / x$ as $x\to0$
      back: 1; by the Taylor series it is $1 - x^2/6 + \cdots$
