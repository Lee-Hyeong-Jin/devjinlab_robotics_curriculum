id: c3-nonlinear-robust-control
title: C3 비선형·강건 제어
summary: >-
  비선형 계의 안정성과 강건성을 증명 수준에서 다룬다. Lyapunov·LaSalle·ISS 로 판정 도구를
  세우고, 피드백 선형화와 가제어성(involutivity·Chow–Rashevskii)으로 좌표를 바꾸고, 수축
  이론으로 궤적 사이의 수렴을 보고, 수동성·에너지 성형으로 접촉을 다루고, 적응 제어로 모르는
  매개변수를, CBF 안전 필터로 제약을 처리한다. 근거가 되는 대학원 과목은 CMU 16-711 Ch5-6,
  Berkeley C106B W1-4, Stanford CS223A(operational space)이고 교재는 Khalil, Modern Robotics
  ch.11, Murray-Li-Sastry ch.6-7, Tedrake Underactuated Robotics ch.9 다. 설계상 레슨은 6개다.
level: 연구
lessons:
  - lyapunov-stability
  - feedback-linearization
  - contraction-incremental
  - passivity-impedance
  - adaptive-control
  - cbf-safety-filter
