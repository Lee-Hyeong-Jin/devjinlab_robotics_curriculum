quiz:
  - id: q1
    prompt: >-
      What is the key step in the proof that the CBF condition $\dot h \ge -\alpha(h)$ gives forward
      invariance?
    choices:
      - "That $h$ is a Lyapunov function, so $h \\to 0$"
      - "That a solution of the comparison ODE $\\dot y = -\\alpha(y)$ with $y(0)\\ge0$ cannot go below zero, and the comparison lemma gives $h \\ge y$"
      - "That $\\alpha$ is bounded"
      - "That the QP is always feasible"
    explanation: >-
      Since $\alpha(0)=0$, $y\equiv0$ solves the comparison ODE, and uniqueness forbids any other
      solution from crossing zero. The comparison lemma then gives $h(x(t)) \ge y(t) \ge 0$. Drop
      the Lipschitz property of $\alpha$ and uniqueness fails, and with it the conclusion.
    concept:
      front: Proof strategy for CBF forward invariance
      back: >-
        Solutions of $\dot y=-\alpha(y)$ cannot cross zero, plus the comparison lemma
  - id: q2
    prompt: >-
      Why does the single-constraint minimum-intervention QP (2) return **exactly** the nominal
      control when the constraint is inactive?
    choices:
      - Because the objective is linear
      - "Because KKT complementarity is satisfied by $\\mu=0$ whenever $\\lambda \\ge 0$"
      - "Because $L_gh$ is zero"
      - Because the QP solver's numerical error is small
    explanation: >-
      If the margin $\lambda = L_fh + L_ghu_{\mathrm{nom}} + \alpha(h) \ge 0$ then $\mu=0$ satisfies
      stationarity, complementarity, feasibility and the sign condition, and the solution is
      $u_{\mathrm{nom}}$. That is why the filter intervenes **only when needed**.
    concept:
      front: Transparency of the minimum-intervention filter
      back: >-
        $\lambda\ge0$ gives $\mu=0$ and $u^\star = u_{\mathrm{nom}}$ - when active it pushes
        minimally along $L_gh$
  - id: q3
    prompt: >-
      For the double integrator $\ddot x = u$ with $h = x_{\max}-x$ and linear $\alpha_i$, what input
      bound does the exponential CBF condition give? (in terms of $\alpha_1,\alpha_2,x,\dot x$)
    answers: ["-(a1+a2) xdot + a1 a2 (xmax - x)", "-(alpha1+alpha2)*xdot + alpha1*alpha2*(xmax-x)", "u <= -(a1+a2)v + a1a2(xmax-x)"]
    explanation: >-
      With $\psi_1 = -\dot x + \alpha_1(x_{\max}-x)$, imposing
      $\dot\psi_1 + \alpha_2\psi_1 \ge 0$ gives
      $u \le -(\alpha_1+\alpha_2)\dot x + \alpha_1\alpha_2(x_{\max}-x)$. The constraint reduces to a
      single upper bound, so the filter is one $\min$.
    concept:
      front: Exponential CBF bound for a double integrator
      back: "$u \\le -(\\alpha_1+\\alpha_2)\\dot x + \\alpha_1\\alpha_2(x_{\\max}-x)$"
  - id: q4
    prompt: >-
      A CBF-QP filter still guarantees safety when the input is limited by $|u| \le u_{\max}$.
    explanation: >-
      If the braking required exceeds $u_{\max}$ the constraint cannot be met and the guarantee is
      gone. Measured: with $\alpha_1=\alpha_2=3$ and $x_{\max}=1$, at $u_{\max}=2$ 95 of 189 runs
      saturate and the worst $\min_t h$ is $-0.138$, a **violation**. At $u_{\max}=20$ there is no
      saturation.
    concept:
      front: Input limits and the CBF guarantee
      back: >-
        Once saturation occurs the guarantee is gone - the safe set must be shrunk in advance
        (input-constrained or backup CBFs)
