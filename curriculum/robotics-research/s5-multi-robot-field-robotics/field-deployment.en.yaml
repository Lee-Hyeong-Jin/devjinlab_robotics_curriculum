  s5-field-deployment-reading: Read the lesson and follow the derivations
  s5-field-deployment-papers: Read the two must-read papers + a one-page note each
  s5-field-deployment-problems: "Problem set (2 derivations, 1 proof, 2 numerical, 1 implementation, 1 counterexample, 1 paper)"
  s5-field-deployment-reproduction: "Reproduction task - reliability analysis of a field log and failure-mode classification of published reports (R2)"
  s5-field-deployment-quiz: Concept check quiz
resources:
  "NIST/SEMATECH e-Handbook of Statistical Methods — Assessing Product Reliability":
    title: "NIST/SEMATECH e-Handbook of Statistical Methods - Assessing Product Reliability"
