id: s5-multi-robot-field-robotics
title: S5 다중 로봇·필드 로보틱스
summary: >-
  여러 대의 로봇이 통신 제약 아래 함께 추정·계획·탐사하는 문제를 다룬다. 그래프 라플라시안과
  합의 수렴률, 분산 최적화와 분산 SLAM, 다중 로봇 경로 계획(MAPF)의 복잡도와 CBS 의 최적성,
  상호정보 목적함수의 submodularity 와 탐욕 보장, 통신 제약·상관 무시가 만드는 과확신과
  공분산 교차, 그리고 필드 배치의 신뢰성 공학까지 간다. 선수 모듈은 C5(상태 추정)·C6(동작 계획)·
  C8(의사결정)이며 설계상 레슨은 6개다(blueprint.md 의 S5 절).
level: 연구
lessons:
  - graph-consensus
