id: r2-capstone
lang: en
title: R2 Capstone
summary: >-
  The track's final stage. In your chosen specialisation you carry out a survey, a reproduction and
  a small contribution, in that order. All three lessons are judged on their deliverables, and the
  bar is not "I read it" but **a result someone else can verify**: a 10-15 page survey classifying
  40 or more papers, an R3-tier reproduction of one paper with a reproduction report, and an
  eight-page workshop-format draft with a 20-minute oral defence. The model is CMU RI's four-part
  Research Qualifier and Georgia Tech's oral-exam format (assigned topic, written summary, 15-20
  minute talk).
