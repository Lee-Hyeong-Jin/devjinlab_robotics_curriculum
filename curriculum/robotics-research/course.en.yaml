id: robotics-research
lang: en
title: Robotics researcher track
summary: >-
  A specialization-grade course for people aiming to become robotics researchers. The bar is set
  by graduate courses at the world's leading departments and by the research level of the
  international venues (RSS, ICRA, IROS, CoRL, IJRR, T-RO, RA-L): every lesson derives its key
  results, reads the primary papers and reproduces them numerically. The design lives in
  research_notes/연구 트랙 설계/blueprint.md (105 lessons) and the lesson standard in
  lesson-standard.md in the same folder. Prerequisites are advisory, never locked.
