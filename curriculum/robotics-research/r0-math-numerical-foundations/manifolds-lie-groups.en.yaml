quiz:
  - id: q1
    prompt: >-
      What is the dimension of $\mathcal{M}=\{x\in\mathbb{R}^n : h(x)=0\}$ for
      $h:\mathbb{R}^n\to\mathbb{R}^m$ of full rank?
    explanation: >-
      By the implicit function theorem it is locally the graph of $n-m$ free variables, so the
      dimension is $n-m$. The tangent space is $\ker Dh$, of the same dimension.
    answers: ["n-m", "n - m", "n minus m"]
    concept:
      front: The dimension of a constraint manifold
      back: $n-m$ under the full-rank condition; the tangent space is $\ker Dh$
  - id: q2
    prompt: $\mathfrak{so}(3)$ (the tangent space of $SO(3)$ at the identity) is the set of which matrices?
    choices:
      - Symmetric matrices
      - Skew-symmetric matrices
      - Orthogonal matrices
      - All trace-free matrices
    explanation: >-
      Differentiating $R^\top R=I$ and evaluating at $t=0$ gives $\dot{R}^\top+\dot{R}=0$, i.e.
      skew-symmetry. Its dimension 3 matches the degrees of freedom of rotation.
    concept:
      front: What $\mathfrak{so}(3)$ is
      back: All skew-symmetric matrices (dimension 3), obtained by differentiating $R^\top R=I$
  - id: q3
    prompt: For arbitrary matrices $A$ and $B$, $\exp(A)\exp(B) = \exp(A+B)$.
    explanation: >-
      It holds only when $AB=BA$. Comparing second-order terms of the series leaves a difference of
      $\tfrac12[A,B]$. Measuring that gap is the BCH expansion, treated in C1.
    concept:
      front: Products of exponentials
      back: $\exp(A)\exp(B)=\exp(A+B)$ only when $AB=BA$; the difference is the commutator (BCH)
  - id: q4
    prompt: What is the **correct** way to apply a small increment to a rotation $R$?
    choices:
      - $R + \Omega$ (matrix addition)
      - $R\exp(\Omega)$ or $\exp(\Omega)R$
      - $R \cdot \Omega$
      - $\Omega^{-1}R$
    explanation: >-
      $SO(3)$ is not a vector space, so $R+\Omega$ is not a rotation matrix
      ($R^\top R \ne I$). Combining by the group operation keeps the result inside the group. The
      choice of left or right leads to the distinction between left and right Jacobians (C1).
    concept:
      front: Increments on a manifold
      back: $R\exp(\Omega)$ (a group operation); addition $R+\Omega$ leaves the group
