quiz:
  - id: q1
    prompt: "Which AD mode is preferable for the gradient of $f: \\mathbb{R}^{1000}\\to\\mathbb{R}$?"
    choices:
      - Forward mode (once per input direction)
      - Reverse mode (once per output component)
      - The two are equivalent
      - AD cannot do it
    explanation: >-
      The output is one-dimensional ($m=1$), so reverse mode gives the whole gradient for **the cost
      of one evaluation**, where forward mode would need 1000. Backpropagation in deep learning is
      this case.
    concept:
      front: Choosing an AD mode
      back: Forward when inputs $n$ ≪ outputs $m$, reverse when $n$ ≫ $m$; an objective ($m=1$) takes reverse
  - id: q2
    prompt: Roughly what is the **best** relative error of a central finite difference in double precision?
    choices:
      - $\epsilon \approx 10^{-16}$
      - $\epsilon^{1/2} \approx 10^{-8}$
      - $\epsilon^{2/3} \approx 4\times10^{-11}$
      - $\epsilon^{1/3} \approx 6\times10^{-6}$
    explanation: >-
      Minimising the sum of $O(h^2)$ truncation and $O(\epsilon/h)$ round-off gives
      $h^\star\sim\epsilon^{1/3}$ with error $\epsilon^{2/3}$. AD has no truncation error and sits
      at $O(\epsilon)$ - five digits apart.
    concept:
      front: Best error of a central difference
      back: $\epsilon^{2/3}\approx4\times10^{-11}$ (at optimal step $h\sim\epsilon^{1/3}$); AD is $O(\epsilon)$
  - id: q3
    prompt: For a stiff problem, it is the accuracy requirement that limits the step size.
    explanation: >-
      **Stability** limits it. Even after the fast mode has died out, the finite stability region of
      an explicit integrator forces $h<2/|\lambda_{\max}|$. That is why implicit (A-stable)
      integrators are used.
    concept:
      front: What limits the step for a stiff problem
      back: Stability, not accuracy; the explicit stability region is finite so the fast mode dictates the step
  - id: q4
    prompt: What property does a symplectic integrator have on a Hamiltonian system?
    choices:
      - It conserves energy exactly
      - It does not conserve energy exactly but keeps it bounded (no long-term drift)
      - It always has high order
      - It is always better for stiff problems
    explanation: >-
      It exactly conserves a **modified Hamiltonian**, so the true energy merely oscillates within
      $O(h^p)$ without accumulating drift. RK4 can let energy drift monotonically however high its order.
    concept:
      front: The property of a symplectic integrator
      back: Energy oscillates boundedly (no long-term drift), because a modified Hamiltonian is conserved exactly
