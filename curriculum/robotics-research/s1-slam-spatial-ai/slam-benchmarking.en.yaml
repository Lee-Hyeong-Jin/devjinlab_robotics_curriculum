id: s1-slam-benchmarking
lang: en
activities:
  s1-slam-benchmarking-reading: Read the lesson and follow the derivations
  s1-slam-benchmarking-papers: Read the three must-read papers + a one-page note each
  s1-slam-benchmarking-problems: "Problem set (1 proof, 2 derivations, 1 numerical, 1 implementation, 1 counterexample, 1 paper)"
  s1-slam-benchmarking-reproduction: "Reproduction task - implement the evaluation tool and compare with a public one, confidence intervals over runs and sequences (R2)"
