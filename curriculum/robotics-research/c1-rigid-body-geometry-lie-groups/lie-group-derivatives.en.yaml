  c1-lie-group-derivatives-problems: "Problem set (2 derivations, 1 proof, 1 numerical, 1 implementation, 1 counterexample)"
  c1-lie-group-derivatives-reproduction: "Reproduction task - Jacobian checks and the Fréchet mean (R1)"
