  s3-whole-body-control-reading: Read the lesson and follow the derivations
  s3-whole-body-control-papers: Read the three must-read papers + a one-page note each
  s3-whole-body-control-problems: "Problem set (1 derivation, 1 proof, 1 numerical, 1 implementation, 2 counterexamples)"
  s3-whole-body-control-reproduction: "Reproduction task - verifying priority preservation of a hierarchical QP (R2)"
