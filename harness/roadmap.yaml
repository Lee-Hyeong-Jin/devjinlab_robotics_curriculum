# 플랫폼 로드맵 = 개발 그래프의 "상태 저장소".
# 바깥 루프 노드(platform-loop)가 여기서 다음 마일스톤을 고르고, 끝나면 status 를 갱신한다.
# 사람이 직접 편집해도 된다. 형식은 scripts/harness/roadmap.py 의 docstring 참고.
#
#   status:     todo | in_progress | done | blocked
#   depends_on: 모두 done 이어야 실행 가능
#   acceptance: 수용 게이트(N8)가 검사하는 완료 조건. 검증 가능하게 쓸 것.
#   note:       integrate 노드(N9)가 한 줄 메모를 남긴다.
#
# [플레이스홀더] 아래 마일스톤 내용은 docs/PRD.md(0.1 Draft) 의 릴리스 계획 Phase 0~1 과
# 부록 A 를 바탕으로 한 초안이다. 플랫폼 설계와 PRD 변경에 따라
# 내용(goal/acceptance)은 바뀔 수 있다. 구조(id/title/status/depends_on/goal/acceptance/note)만 확정.
# Phase 1 스택: Python 단일(uv + ruff + pytest), 콘텐츠는 Markdown + YAML, CLI + 정적 사이트.

milestones:
    - id: P0-1
      title: 프로젝트 골격 (Python, uv, ruff, pytest, rc CLI 진입점)
      status: done
      depends_on: []
      goal: pyproject.toml 기반 Python 프로젝트 골격과 `rc` CLI 진입점을 만들고, 하네스 검증 게이트가 실제로 돌게 한다.
      acceptance:
        - 루트에 pyproject.toml 이 있고 `uv run ruff check .`, `uv run pytest -q` 가 통과한다
        - `bash scripts/harness/check.sh` 가 ALL CHECKS PASSED 를 출력한다
        - `uv run rc --help` 가 동작하고 validate/report 서브커맨드 자리가 있다
        - README.md 에 설치/실행/테스트 명령이 있고 CLAUDE.md Commands 섹션이 채워져 있다
      note: M0 skeleton merged into integration (95c1da5)

    - id: P0-2
      title: 콘텐츠 스키마·로더·검증 CLI (FR-1)
      status: done
      depends_on: [P0-1]
      goal: Track > Module > Lesson > Activity 계층을 Markdown+YAML frontmatter 로 정의하고, 로더와 `rc validate` 를 만든다.
      acceptance:
        - 레슨 필수 필드(id, title, prerequisites, estimated_minutes, objectives, tags)와 Activity 타입(reading, quiz, exercise)이 코드와 docs/curriculum/CONTENT_MODEL.md 에 정의되어 있다
        - `rc validate` 가 누락 필드, 존재하지 않는 선수지식 ID, 순환 의존을 감지하면 비정상 종료 코드를 반환하며 각 경우에 테스트가 있다
        - docs/curriculum/LESSON_TEMPLATE.md 형식의 샘플 레슨이 로더로 읽힌다
      note: M1 content model merged (526c4d3)

    - id: P0-3
      title: 로보틱스 전문가 코스 기초 단계 콘텐츠 (부록 A 기초 모듈)
      status: done
      depends_on: [P0-2]
      goal: curriculum/robotics-expert/ 에 기초 단계(level 기초) 모듈 M1~M3(수학·물리 기초, 운동학, 이동 로봇·제어)을 레슨 10개 내외로 작성하고, 각 레슨에 "이 단계 공부법" 절과 resources 를 넣는다.
      acceptance:
        - curriculum/ 에 코스 1개(robotics-expert), 기초 모듈 3개, 레슨 9개 이상이 있고 `rc validate` 가 통과한다
        - 모든 레슨에 선수지식이 선언되어 있고 그래프가 DAG 이다
        - 모든 레슨에 resources 1개 이상과 "이 단계 공부법" 절이 있다
      note: robotics-expert 기초 모듈 3개, 레슨 9개 (46339ae)

    - id: P0-4
      title: 주간 리포트 CLI (FR-7)
      status: done
      depends_on: [P0-2]
      goal: 학습 기록을 입력으로 주간 리포트 Markdown 을 reports/YYYY-WW.md 에 생성하는 `rc report weekly` 를 만든다.
      acceptance:
        - `rc report weekly` 가 reports/YYYY-WW.md 를 생성하고 학습 시간, 완료 레슨, 퀴즈 정답률, 복습 수, 메모 요약 섹션을 포함한다
        - 리포트 생성은 단위 테스트로 커버된다(고정 입력 → 기대 출력)
      note: weekly/module report merged (4fa7ffc); quiz stats pending P1-2

    - id: P1-1
      title: 학습 진도 추적 저장소 (FR-3, FR-10)
      status: done
      depends_on: [P0-2]
      goal: Activity 단위 상태, 이해도, 메모, 세션 시간을 로컬 SQLite 에 저장·조회하고 JSON 으로 내보내기/가져오기한다.
      acceptance:
        - Progress/Session 모델에 user_id 가 있고 상태(not_started, in_progress, done) 변경이 저장 후 재조회로 확인된다
        - `rc progress export/import` 가 JSON 왕복에서 데이터를 보존한다(테스트)
        - 저장소 인터페이스와 SQLite 구현이 분리되어 있고 선택 이유가 ADR 에 있다
      note: progress store merged (65d587a)

    - id: P1-2
      title: 퀴즈·플래시카드·간격 반복 (FR-4 P0)
      status: todo
      depends_on: [P1-1]
      goal: Markdown 으로 정의한 퀴즈를 채점하고, 틀린 문항과 핵심 개념을 카드로 만들어 SM-2 또는 FSRS 로 복습 일정을 계산한다.
      acceptance:
        - 객관식·단답·O/X 퀴즈가 파싱·채점되고 해설이 표시된다
        - 카드 응답(again, hard, good, easy)에 따라 next_due 가 달라지는 테스트가 있다
        - 알고리즘 선택(SM-2 vs FSRS)이 ADR 로 기록되어 있다
      note:

    - id: P1-3
      title: 로드맵·선수지식 그래프·다음 레슨 추천 (FR-2)
      status: done
      depends_on: [P1-1]
      goal: 트랙의 레슨을 선수지식 DAG 로 계산하고 완료/진행/잠김 상태와 다음 추천 레슨을 CLI 와 정적 사이트에서 보여준다.
      acceptance:
        - `rc next` 가 선수지식 충족 + 미완료 레슨 중 트랙 순서상 가장 앞선 것을 반환한다(테스트)
        - 잠김 레슨 강제 열기 시 경고가 표시된다
        - 그래프 출력(텍스트 또는 정적 HTML)에 완료/진행/잠김이 구분된다
      note: rc roadmap + locked warning (0dc7654)

    - id: P1-4
      title: 학습 자료·학습 방법 라이브러리 (FR-6)
      status: done
      depends_on: [P0-3]
      goal: 레슨별 resources 와 "이 단계 공부법" 을 CLI 와 정적 사이트에서 보기 좋게 보여주고, research_notes/ 의 조사 결과를 자료 목록으로 연결한다.
      acceptance:
        - `rc resources <lesson_id>` 가 레슨의 resources 를 종류별로 출력하고 테스트가 있다
        - 정적 사이트 레슨 페이지에 "이 단계 공부법" 절과 자료 목록이 렌더링된다
        - 자료 항목의 url 형식이 `rc validate` 에서 검사된다
      note: CLI + site rendering (e772270, 123e88f)

    - id: P1-5
      title: 정적 사이트·대시보드 (Phase 1 MVP 마감)
      status: done
      depends_on: [P0-4, P1-2, P1-3, P1-4]
      goal: 레슨 뷰어(수식·코드 렌더링), 로드맵, 대시보드(진도율, 주간 학습 시간, streak, 오늘 복습 수)를 정적 사이트로 생성한다.
      acceptance:
        - `rc site build` 가 정적 사이트를 생성하고 레슨 본문의 KaTeX 수식과 코드 하이라이트가 렌더링된다
        - 대시보드 페이지에 트랙별 진도율, 주간 학습 시간, streak, 오늘 복습 수가 표시된다
        - 사이트 빌드가 테스트로 커버되고 네트워크 없이 동작한다
      note: static site merged (123e88f)

    # ---- Phase 2: 오픈소스·엔터프라이즈 웹 플랫폼 ----
    # 코어 라이브러리(robotics_curriculum)는 그대로 두고 API·인증·DB·웹을 그 위에 얹는다.

    - id: P2-0
      title: 오픈소스·엔지니어링 기반
      status: done
      depends_on: [P0-1]
      goal: 오픈소스 공개와 기업 수준 개발을 위한 라이선스, 기여 규칙, CI, 타입 검사, 커버리지 게이트, pre-commit, Docker 이미지를 갖춘다.
      acceptance:
        - LICENSE(Apache-2.0), NOTICE, curriculum/LICENSE(CC BY 4.0), CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, CHANGELOG.md 가 있다
        - .github/workflows/ci.yml 이 ruff, ruff format --check, mypy, pytest --cov, rc validate, rc site build 를 실행한다
        - `uv run mypy` 가 strict 설정으로 src/ 에서 오류 0건이다
        - `bash scripts/harness/check.sh` 가 mypy 와 커버리지 게이트(fail_under 80)를 포함해 ALL CHECKS PASSED 를 출력한다
        - `uv run pre-commit run --all-files` 가 통과하고 `docker build .` 이미지가 비루트 사용자로 `rc --help` 를 실행한다
      note: governance, CI, mypy strict, coverage 94%, pre-commit, Docker

    - id: P2-1
      title: API 서버 (FastAPI, OpenAPI, 코어 라이브러리 래핑)
      status: todo
      depends_on: [P2-0]
      goal: 코어 라이브러리(content, progress, report, roadmap)를 FastAPI 로 감싸 콘텐츠 조회, 진도, 로드맵, 리포트를 HTTP 로 제공하고 OpenAPI 스키마를 공개한다.
      acceptance:
        - 코스·모듈·레슨 조회, 진도 갱신, 다음 레슨 추천, 주간 리포트 엔드포인트가 있고 각 엔드포인트에 httpx/TestClient 테스트가 있다
        - /openapi.json 이 생성되고 스키마 스냅샷 테스트가 API 변경을 감지한다
        - API 계층은 코어 라이브러리 함수를 호출만 하며 비즈니스 로직 중복이 없다(라우터에서 store/loader 를 직접 다루지 않음)
        - 프레임워크 선택과 API 버전 정책(/api/v1)이 ADR 에 기록되어 있다
      note:

    - id: P2-2
      title: 인증·권한 (로컬 계정 Argon2id + OIDC, RBAC, 사용자별 진도)
      status: todo
      depends_on: [P2-1, P2-3]
      goal: 로컬 계정(Argon2id 해시)과 OIDC 로그인을 지원하고, learner/author/admin 역할로 API 접근을 제어하며, 진도를 사용자별로 분리한다.
      acceptance:
        - 비밀번호는 Argon2id 로만 저장되고 평문·가역 저장이 없음을 테스트가 확인한다
        - OIDC 로그인 흐름이 모의 IdP(테스트 픽스처)로 끝까지 통과한다
        - 역할별 권한 매트릭스(learner/author/admin × 엔드포인트) 테스트에서 허용·거부(401/403)가 모두 기대대로 나온다
        - 사용자 A 의 진도가 사용자 B 의 조회·수정 요청에 노출되지 않는 테스트가 있다
        - 세션/토큰 방식과 만료 정책이 ADR 에 기록되어 있다
      note:

    - id: P2-3
      title: PostgreSQL 저장소·마이그레이션 (ProgressStore 구현, Alembic)
      status: todo
      depends_on: [P2-1]
      goal: 기존 ProgressStore 인터페이스의 PostgreSQL 구현과 Alembic 마이그레이션을 추가하고, SQLite 구현과 같은 계약 테스트를 통과시킨다.
      acceptance:
        - 동일한 ProgressStore 계약 테스트 스위트가 SQLite 와 PostgreSQL(컨테이너) 구현 모두에서 통과한다
        - `alembic upgrade head` 와 `alembic downgrade base` 가 빈 DB 에서 오류 없이 왕복된다(CI 테스트)
        - SQLite(.rc/progress.db) 또는 JSON 내보내기에서 PostgreSQL 로 옮기는 마이그레이션 명령이 데이터를 보존한다(테스트)
        - 모든 학습 데이터 테이블에 user_id 가 있고 인덱스가 정의되어 있다
      note:

    - id: P2-4
      title: 웹 프론트엔드 (로그인, 대시보드, 로드맵, 레슨, 자료실, 관리자)
      status: todo
      depends_on: [P2-1, P2-2]
      goal: API 를 사용하는 웹 프론트엔드로 로그인, 대시보드, 로드맵, 레슨 뷰어(수식·코드), 자료실, 관리자 화면을 제공한다. 디자인은 docs/platform-design.md 를 따른다.
      acceptance:
        - 로그인 → 대시보드 → 로드맵 → 레슨 열기 → 완료 표시 흐름이 E2E 테스트(헤드리스 브라우저)로 통과한다
        - 레슨 뷰어가 KaTeX 수식과 코드 하이라이트를 렌더링하고 "이 단계 공부법" 절과 자료 목록을 표시한다
        - 관리자 화면은 admin 역할에서만 접근되고 learner 접근은 거부된다(E2E 또는 컴포넌트 테스트)
        - 프론트엔드 lint·타입 검사·테스트가 CI 와 check.sh(node 스택)에서 실행된다
        - 프레임워크 선택이 ADR 에 기록되어 있다
      note:

    - id: P2-5
      title: 운영 (Docker Compose api/db/web, 헬스체크, 구조화 로깅, 메트릭, 백업)
      status: todo
      depends_on: [P2-3, P2-4]
      goal: docker compose 하나로 api, db, web 을 띄우고 헬스체크, JSON 구조화 로깅, Prometheus 메트릭, DB 백업·복구 절차를 갖춘다.
      acceptance:
        - `docker compose up` 후 api/db/web 서비스가 모두 healthy 상태가 되고 CI 스모크 테스트가 이를 확인한다
        - /healthz(활성)와 /readyz(DB 연결 포함) 엔드포인트가 있고 DB 중단 시 readyz 가 실패한다(테스트)
        - 로그가 요청 ID 를 포함한 JSON 한 줄 형식으로 출력되고 비밀번호·토큰이 로그에 남지 않음을 테스트가 확인한다
        - /metrics 가 요청 수·지연 시간 메트릭을 Prometheus 형식으로 노출한다
        - 백업 스크립트로 만든 덤프를 빈 DB 에 복구해 진도 데이터가 일치함을 검증하는 절차가 문서와 테스트로 있다
      note:

    - id: P2-6
      title: i18n·접근성 (ko/en, WCAG 2.1 AA)
      status: todo
      depends_on: [P2-4]
      goal: 웹 UI 와 CLI 메시지를 한국어·영어로 제공하고, 웹 UI 가 WCAG 2.1 AA 를 충족한다.
      acceptance:
        - UI 문자열이 번역 카탈로그로 분리되어 있고 ko/en 키 누락을 검사하는 테스트가 CI 에서 실행된다
        - 사용자가 언어를 전환하면 설정이 저장되고 다음 로그인에도 유지된다(테스트)
        - 주요 화면(로그인, 대시보드, 로드맵, 레슨, 자료실, 관리자)에 axe-core 자동 검사 결과 심각·치명 위반이 0건이다
        - 키보드만으로 로그인부터 레슨 완료 표시까지 진행할 수 있음을 E2E 테스트가 확인한다
      note:
