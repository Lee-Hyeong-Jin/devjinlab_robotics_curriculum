# 플랫폼 로드맵 = 개발 그래프의 "상태 저장소".
# 바깥 루프 노드(platform-loop)가 여기서 다음 마일스톤을 고르고, 끝나면 status 를 갱신한다.
# 사람이 직접 편집해도 된다. 형식은 scripts/harness/roadmap.py 의 docstring 참고.
#
#   status:     todo | in_progress | done | blocked
#   depends_on: 모두 done 이어야 실행 가능
#   acceptance: 수용 게이트(N8)가 검사하는 완료 조건. 검증 가능하게 쓸 것.
#   note:       integrate 노드(N9)가 한 줄 메모를 남긴다.
#
# 기준 문서: docs/PRD.md v0.9 의 릴리스 계획(§10)과 부록 C(마일스톤별 사용자 스토리·수용 기준).
# acceptance 줄 앞의 AC-ID(AC-4.x, AC-API.x, AC-AUTH.x, AC-DB.x, AC-OPS.x)는 부록 C 표의 행을 가리키며,
# 상세 기준과 검증 방법은 부록 C 가 원본이다. 여기에는 수용 게이트(N8)가 검사할 요지만 적는다.
# 구조(id/title/status/depends_on/goal/acceptance/note)는 확정, 내용은 PRD 개정에 따라 갱신한다.
# Phase 1 스택: Python 단일(uv + ruff + pytest), 콘텐츠는 Markdown + YAML, CLI + 정적 사이트.
#
# Phase 1 공통 기준(부록 C.0, QA 리뷰에서 도출): 아래 P1-x 마일스톤 전부에 추가로 적용된다.
#   AC-SEC.1 정적 사이트 출력 인코딩·sanitize + CSP 메타 태그 (XSS 픽스처 테스트)
#   AC-SEC.2 `--out`/`--src` 경로 보호: 빌드 마커 또는 빈 디렉터리만 덮어쓰고, 저장소 밖·겹치는 경로 거부
#   AC-SEC.3 콘텐츠를 읽는 모든 명령(site, 진행도, 퀴즈, 리포트)이 같은 로더·검증기를 거친다
#   AC-SEC.4 레슨 id 는 curriculum/ 전체에서 유일하고 중복 시 로더가 에러를 낸다
#   AC-SEC.5 `rc progress import` 가 스키마·존재하는 ID·상태 값·시간 불변식을 검증하고 위반 시 아무것도 쓰지 않는다
#   AC-SEC.6 CI 의존성 취약점 스캔 — 충족: .github/workflows/security.yml 의 pip-audit(84b13c2).
#            pip-audit 에 심각도 필터가 없어 런타임 의존성의 알려진 취약점이 하나라도 있으면 실패한다(고위험 기준의 상위집합).
#   AC-SEC.1~5 는 이미 done 인 P1-4·P1-5 산출물에도 걸리므로 담당자 배정이 필요하다(오케스트레이터 확인 중).

milestones:
    - id: P0-1
      title: 프로젝트 골격 (Python, uv, ruff, pytest, rc CLI 진입점)
      status: done
      depends_on: []
      goal: pyproject.toml 기반 Python 프로젝트 골격과 `rc` CLI 진입점을 만들고, 하네스 검증 게이트가 실제로 돌게 한다.
      acceptance:
        - 루트에 pyproject.toml 이 있고 `uv run ruff check .`, `uv run pytest -q` 가 통과한다
        - `bash scripts/harness/check.sh` 가 ALL CHECKS PASSED 를 출력한다
        - `uv run rc --help` 가 동작하고 validate/report 서브커맨드 자리가 있다
        - README.md 에 설치/실행/테스트 명령이 있고 CLAUDE.md Commands 섹션이 채워져 있다
      note: M0 skeleton merged into integration (95c1da5)

    - id: P0-2
      title: 콘텐츠 스키마·로더·검증 CLI (FR-1)
      status: done
      depends_on: [P0-1]
      goal: Track > Module > Lesson > Activity 계층을 Markdown+YAML frontmatter 로 정의하고, 로더와 `rc validate` 를 만든다.
      acceptance:
        - 레슨 필수 필드(id, title, prerequisites, estimated_minutes, objectives, tags)와 Activity 타입(reading, quiz, exercise)이 코드와 docs/curriculum/CONTENT_MODEL.md 에 정의되어 있다
        - `rc validate` 가 누락 필드, 존재하지 않는 선수지식 ID, 순환 의존을 감지하면 비정상 종료 코드를 반환하며 각 경우에 테스트가 있다
        - docs/curriculum/LESSON_TEMPLATE.md 형식의 샘플 레슨이 로더로 읽힌다
      note: M1 content model merged (526c4d3)

