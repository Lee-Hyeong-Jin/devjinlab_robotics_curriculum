    - id: P1-2
      title: 퀴즈·플래시카드·간격 반복 (FR-4 P0)
      status: done
      depends_on: [P1-1, P1-5]
      goal: 레슨 Markdown 의 quiz 블록을 검증·채점하고, 틀린 문항과 핵심 개념을 카드로 만들어 SM-2 로 복습 일정을 계산한다(PRD 부록 C.1).
      acceptance:
        - AC-4.1 `rc validate` 가 퀴즈 블록 오류(YAML, type, answer 범위, explanation 누락, activity 참조, id 중복)를 파일경로와 함께 보고하고 종료 코드 1
        - AC-4.2 `rc quiz <lesson>` 이 즉시 정오·해설을 보이고 점수·소요 시간을 한 트랜잭션으로 저장, 중간 종료 시 저장 없음
        - AC-4.3 틀린 문항은 source=quiz 카드, concept 문항은 source=concept 카드가 되며 재응시해도 중복 생성되지 않는다
        - AC-4.4 `rc review` 가 due 카드만 제시하고 again/hard/good/easy 응답으로 SM-2 interval·ease·next_due 를 갱신한다(기준 표 단위 테스트)
        - AC-4.5 SM-2 채택과 FSRS 보류 이유가 docs/adr/ 에 기록되어 있다
        - AC-4.6 `rc status` 에 오늘 복습 예정 수와 최근 7일 퀴즈 정답률이 표시된다
        - AC-4.7 정적 사이트 레슨 페이지에 퀴즈가 정답·해설을 접은 details 요소로 렌더링된다
        - AC-4.8a LESSON_TEMPLATE.md 에 퀴즈 블록 예시, CONTENT_MODEL.md 에 퀴즈 스키마가 있다(백엔드 개발자)
        - AC-4.8b 기초 M1 레슨 2개 이상에 실제 퀴즈가 있고 `rc validate` 와 `rc quiz` 가 통과한다(커리큘럼 저자)
        - AC-4.9 코어 라이브러리 라인·분기 커버리지 80% 이상(fail_under=80), mypy strict 통과
      note: quiz blocks, SM-2, rc quiz/review, progress v2 + alembic 0002 (d518e15, a581230); AC-4.8b content pending

