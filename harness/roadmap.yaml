    # ---- Phase 2: 오픈소스·엔터프라이즈 웹 플랫폼 ----
    # 코어 라이브러리(robotics_curriculum)는 그대로 두고 API·인증·DB·웹을 그 위에 얹는다.

    - id: P2-0
      title: 오픈소스·엔지니어링 기반
      status: done
      depends_on: [P0-1]
      goal: 오픈소스 공개와 기업 수준 개발을 위한 라이선스, 기여 규칙, CI, 타입 검사, 커버리지 게이트, pre-commit, Docker 이미지를 갖춘다.
      acceptance:
        - LICENSE(Apache-2.0), NOTICE, curriculum/LICENSE(CC BY 4.0), CONTRIBUTING.md, CODE_OF_CONDUCT.md, SECURITY.md, CHANGELOG.md 가 있다
        - .github/workflows/ci.yml 이 ruff, ruff format --check, mypy, pytest --cov, rc validate, rc site build 를 실행한다
        - `uv run mypy` 가 strict 설정으로 src/ 에서 오류 0건이다
        - `bash scripts/harness/check.sh` 가 mypy 와 커버리지 게이트(fail_under 80)를 포함해 ALL CHECKS PASSED 를 출력한다
        - `uv run pre-commit run --all-files` 가 통과하고 `docker build .` 이미지가 비루트 사용자로 `rc --help` 를 실행한다
      note: governance, CI, mypy strict, coverage 94%, pre-commit, Docker

    - id: P2-1
      title: API 서버 (FastAPI, OpenAPI, 코어 라이브러리 래핑)
      status: done
      depends_on: [P2-0, P1-2]
      goal: 코어 라이브러리(content, progress, report, roadmap)를 FastAPI 로 감싸 /api/v1 아래에서 콘텐츠 조회, 진행도, 로드맵, 리포트를 제공하고 OpenAPI 스키마를 공개한다(PRD 부록 C.2, 설계 docs/platform-design.md §1·§1.1).
      acceptance:
        - AC-API.1 코스·모듈·레슨 조회, 세션 start/stop/log, done, status, next, 주간·모듈 리포트, 진행도 export 엔드포인트가 /api/v1 아래 있고 엔드포인트별 TestClient 테스트가 있다. 퀴즈·복습 엔드포인트는 P1-2 머지 후 추가
        - AC-API.2 /openapi.json 스냅샷 테스트가 비호환 변경을 감지하고, 오류 응답은 RFC 9457 application/problem+json 이다
        - AC-API.3 라우터는 코어 라이브러리 함수만 호출하고(store/loader 직접 사용 없음) CLI/API 동치 테스트가 1건 이상 있다
        - AC-API.4 무상태 서버, /healthz 와 /readyz, JSON 구조화 로그, 요청 ID(응답 헤더와 로그 동일)를 최소 구현한다. 메트릭은 P2-5(AC-OPS.1)
        - AC-API.7 프레임워크 선택과 버전 정책(/api/v1, 비호환은 /api/v2)이 ADR 에 기록되어 있다
        - AC-API.6 서버 콘텐츠 색인(재색인 엔드포인트 또는 시작 시 색인), 실패 시 이전 색인 유지, 레슨 1,000개 60초 이내(설계 §1.1 서버 색인)
        - (이동) AC-API.5 는 P2-3(AC-DB.1~3), AC-API.8 은 P2-5(AC-OPS.3)에서 판정한다
      note: API v1 merged; follow-up: /progress/status stages, week, streak_days (api-developer, with P2-2); due_cards after P1-2

    - id: P2-2
      title: 인증·권한 (로컬 계정 Argon2id + OIDC, RBAC, 사용자별 진행도)
      status: done
      depends_on: [P2-1, P2-3]
      goal: 로컬 계정(Argon2id 해시)과 OIDC 로그인을 지원하고, learner/author/admin 역할로 API 접근을 제어하며, 진행도를 사용자별로 분리한다(PRD 부록 C.3, 설계 §8 → docs/architecture/auth.md).
      acceptance:
        - AC-AUTH.1 비밀번호는 Argon2id 로만 저장되고 평문·가역 저장·로그 노출이 없다. 최소 12자, 재설정 토큰은 1회용·만료 30분
        - AC-AUTH.2 로그인 실패 5회(계정·IP, 15분 창) 후 지연 또는 임시 잠금, 인증 성공·실패가 감사 로그에 남는다
        - AC-AUTH.3 OIDC Authorization Code + PKCE 흐름이 모의 IdP 픽스처로 끝까지 통과하고 같은 이메일의 로컬 계정과 연결된다
        - AC-AUTH.4 역할 매트릭스(learner/author/admin × 모든 엔드포인트)가 문서화되고 허용·401·403 을 모두 확인하는 파라미터화 테스트가 있다
        - AC-AUTH.5 사용자 A 의 진행도·카드·노트·리포트가 사용자 B 의 조회·수정 요청에 노출되지 않는다(교차 접근 테스트)
        - AC-AUTH.6 자기 데이터 JSON 내보내기(rc progress import 호환), 계정 삭제 시 학습 데이터 즉시 삭제, 감사 로그 식별자는 보존 기간(기본 90일) 뒤 익명화
        - AC-AUTH.7 세션/토큰 방식과 만료·갱신·로그아웃 무효화 정책이 ADR 에 기록되고 구현과 일치한다
        - AC-AUTH.8 OWASP ASVS L2 V2·V3·V4 체크리스트 파일이 있고 CSRF 방어와 보안 헤더(CSP, HSTS)가 테스트로 확인된다
        - AC-AUTH.9 메일 어댑터(인터페이스 + SMTP 구현 + fake mailer)로 재설정 흐름이 테스트되고, 메일 미설정 시 재설정이 비활성으로 안내된다
      note: local accounts, sessions, CSRF, PAT, RBAC, audit, OIDC+PKCE, alembic 0003 (46f1398, 66a7dfb); follow-ups: GitHub OAuth2 adapter, IdP role mapping, server security review findings

    - id: P2-3
      title: PostgreSQL 저장소·마이그레이션 (ProgressStore 구현, Alembic)
      status: done
      depends_on: [P2-1]
      goal: 기존 ProgressStore 인터페이스의 PostgreSQL 구현과 Alembic 마이그레이션을 추가하고, SQLite 구현과 같은 계약 테스트를 통과시킨다(PRD 부록 C.4, 설계 §4.5).
      acceptance:
        - AC-DB.1 같은 ProgressStore 테스트 스위트가 SQLite 와 PostgreSQL 에서 통과한다(CI 에 Postgres 서비스 컨테이너)
        - AC-DB.2 스키마 변경은 Alembic 으로만 하고, 빈 DB → head, head → 한 단계 down → up 왕복이 CI 에서 통과하며 마이그레이션 없는 모델 변경은 테스트가 실패시킨다
        - AC-DB.3 `rc progress export` JSON 을 서버 계정으로 가져올 수 있고 레슨 ID 기준으로 병합·중복 방지된다(왕복 테스트)
        - 모든 학습 데이터 테이블에 user_id 가 있고 인덱스가 정의되어 있다(AC-AUTH.5 의 전제)
      note: store, alembic 0001, transfer CLI, factory wiring (55d5cf1); 0002/0003 follow P1-2 and P2-2

    - id: P2-4
      title: 웹 프론트엔드 (로그인, 대시보드, 로드맵, 레슨, 자료실, 관리자)
      status: in_progress
      depends_on: [P2-1, P2-2]
      goal: API 를 사용하는 웹 프론트엔드로 로그인, 대시보드, 로드맵, 레슨 뷰어(수식·코드), 자료실, 관리자 화면을 제공한다. 디자인은 docs/platform-design.md 를 따른다.
      acceptance:
        - AC-WEB.1 로그인 → 대시보드 → 로드맵 → 레슨 열기 → 완료 표시 흐름이 헤드리스 브라우저 E2E 테스트로 통과한다
        - AC-WEB.2 레슨 뷰어가 KaTeX 수식·코드 하이라이트, "이 단계 공부법" 절, resources[] 목록(제목·종류·범위 메모·링크)을 표시하고 정적 사이트와 같은 의미로 보인다
        - AC-WEB.3 대시보드(단계·모듈·코스 진행률, 주간 학습 시간, 연속 학습일, 오늘 복습 수, 다음 레슨)와 로드맵(잠김·진행·완료 색 구분, 현재 단계 강조)
        - AC-WEB.4 관리자 화면은 admin 만 접근되고 learner·author 는 거부된다. 프론트엔드 숨김이 아니라 API 권한 검사(403)에 의존한다
        - AC-WEB.5 자료실(모듈·레슨별 목록, 종류 필터, 외부 링크는 새 탭). 퀴즈·복습 UI 는 P1-2 API 노출 후 추가
        - AC-WEB.6 프론트엔드 lint·타입 검사·테스트가 CI 와 check.sh(node 스택)에서 실행되고 주요 화면 LCP 2.5초 이내
        - AC-WEB.7 프레임워크 선택(설계 §1.2 비교표 기준)이 ADR 에 기록되고 화면 구조는 docs/platform-design.md 의 7페이지 구조를 따른다
      note: web v1 merged (522ad20): dashboard, roadmap, module, lesson, resources, i18n, a11y; v2: login, profile, admin, quiz, review, search, report

    - id: P2-5
      title: 운영 (Docker Compose api/db/web, 헬스체크, 구조화 로깅, 메트릭, 백업)
      status: in_progress
      depends_on: [P2-3, P2-4]
      goal: docker compose 하나로 api, db, web 을 띄우고 헬스체크, JSON 구조화 로깅, Prometheus 메트릭, 부하 기준, DB 백업·복구 절차를 갖춘다(PRD 부록 C.5, 설계 §9 → docs/architecture/operations.md).
      acceptance:
        - AC-OPS.1 /readyz 가 DB 연결과 콘텐츠 색인 완료를 확인하고(DB 중단 시 실패), /metrics 가 요청 수·지연·오류율·DB 풀을 Prometheus 형식으로 노출하며, JSON 로그의 요청 ID 가 응답 헤더와 같고 비밀번호·토큰이 남지 않는다
        - AC-OPS.2 deploy/ 의 Compose(api + web + postgres + reverse proxy)로 신규 설치가 문서 기준 30분 이내, 비밀은 .env 주입과 .env.example 제공, 이미지 linux/amd64·arm64. `docker compose up` 후 전 서비스 healthy 를 CI 스모크 테스트가 확인한다
        - AC-OPS.3 부하 테스트(k6 또는 locust)가 읽기 p95 300ms, 쓰기 p95 1초, 동시 500명·레슨 1,000개 시나리오를 통과하고 스크립트와 결과가 docs/ 에 있다
        - AC-OPS.4 백업·복구 절차(RPO 24시간, RTO 4시간)와 복구 리허설 기록 1회가 있고, 관리 행위 감사 로그와 보존 기간 설정이 테스트된다
      note: api+db compose, migrate, smoke merged (69b87cf); web service, metrics, backup pending

    - id: P2-6
      title: i18n·접근성 (ko/en, WCAG 2.1 AA)
      status: in_progress
      depends_on: [P2-4]
      goal: 웹 UI 와 CLI 메시지를 한국어·영어로 제공하고, 웹 UI 가 WCAG 2.1 AA 를 충족한다.
      acceptance:
        - AC-I18N.1 웹 UI·CLI 문자열이 ko/en 번역 카탈로그로 분리되고 키 누락·미사용 키 검사가 CI 에서 실행된다
        - AC-I18N.2 언어 전환이 사용자 설정에 저장되어 다음 로그인에도 유지되고(비로그인·로컬 모드는 브라우저/OS 로케일), 날짜·숫자가 로케일 형식이다
        - AC-I18N.3 레슨 콘텐츠는 번역 대상이 아니다(언어 태그·번역본 병행은 Phase 3) — 문서로 확인
        - AC-A11Y.1 주요 화면(로그인, 대시보드, 로드맵, 레슨, 자료실, 관리자)에 axe-core 심각·치명 위반 0건이고 이 검사가 CI 에서 실행된다
        - AC-A11Y.2 키보드만으로 로그인 → 레슨 완료 표시까지 가능하고 포커스 표시·건너뛰기 링크·폼 레이블·명도 대비 4.5:1 이 다크 모드에서도 WCAG 2.1 AA 를 충족한다
        - AC-A11Y.3 로드맵 그래프·진행률 등 시각 정보에 텍스트 대안(표 또는 목록)이 있다
      note: i18n core merged (636e3d9: catalog ko/en, CLI/API/site labels); web i18n in web v1; a11y audit + content/en pending
