# Phase 1: the rc CLI. Phase 2 adds services step by step (harness/roadmap.yaml P2-5).
# Usage: export RC_DB_PASSWORD=... RC_AUTH_SECRET=...   # required (RUNBOOK §8)
#        docker compose run --rm cli validate
#        docker compose up -d db      # PostgreSQL for server mode (P2-3, docs/adr/0007)
#        docker compose up -d --wait api   # db -> migrate -> api (bash scripts/smoke.sh)
#        docker compose up -d --wait web   # the frontend on http://127.0.0.1:3000
# The reverse proxy follows (docs/architecture/operations.md).
# Secrets have no defaults: compose refuses to start until they are set (server review SRV-06).
# The api runs in server mode (accounts, sessions; SRV-01) on a read-only root filesystem with
# no Linux capabilities (SRV-09). Production can swap the env values for Docker secrets.
services:
  # One-shot tool, not part of `up`: docker compose run --rm cli validate
  cli:
    profiles: ["cli"]
    build: .
    image: robotics-curriculum:local
    volumes:
      - rc-data:/data
      - ./curriculum:/app/curriculum:ro

  db:
    image: postgres:16.13
    environment:
      POSTGRES_DB: rc
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: ${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. Same image as api, alembic instead of rc.
  migrate:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}@db:5432/rc
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    environment:
      RC_AUTH_MODE: server
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}@db:5432/rc
      RC_AUTH_SECRET: ${RC_AUTH_SECRET:?set RC_AUTH_SECRET (see docs/operations/RUNBOOK.md §8)}
      RC_AUTH_ADMIN_EMAIL: ${RC_AUTH_ADMIN_EMAIL:-}
      RC_AUTH_COOKIE_SECURE: ${RC_AUTH_COOKIE_SECURE:-1}
      RC_PUBLIC_URL: ${RC_PUBLIC_URL:-http://localhost:3000}
      # Anonymous read-only access to the curriculum (ADR 0016). Both api and web need it:
      # the api decides what it serves, the web decides what may be indexed.
      RC_PUBLIC_CONTENT: ${RC_PUBLIC_CONTENT:-0}
      RC_OIDC_PROVIDERS: ${RC_OIDC_PROVIDERS:-}
      RC_SMTP_HOST: ${RC_SMTP_HOST:-}
      RC_SMTP_PORT: ${RC_SMTP_PORT:-587}
      RC_SMTP_USER: ${RC_SMTP_USER:-}
      RC_SMTP_PASSWORD: ${RC_SMTP_PASSWORD:-}
      RC_SMTP_FROM: ${RC_SMTP_FROM:-}
      RC_API_LOG_LEVEL: ${RC_API_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image carries no curl/wget, so probe with the interpreter that is already there.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/readyz", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Scheduled backup for hosts without the repository checked out (cron, systemd timer):
  #   docker compose run --rm backup
  # Interactive use goes through scripts/ops/backup.sh, which also prunes old dumps.
  backup:
    profiles: ["ops"]
    image: postgres:16.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec pg_dump -Fc -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > "/backups/rc-$$(date -u +%Y%m%dT%H%M%SZ).dump"'
    environment:
      POSTGRES_USER: rc
      POSTGRES_DB: rc
      PGPASSWORD: ${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}
    volumes:
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend (P2-4/P2-5). Appended after `backup` on purpose: the api/db block is being
  # hardened in another branch, and keeping the web block at the end keeps the merge clean.
  # Server-rendered Next.js, so it needs the api reachable, not a build-time URL.
  web:
    build:
      context: .
      target: web
    image: robotics-curriculum-web:local
    environment:
      # Inside the compose network the api answers on its service name.
      RC_API_BASE_URL: http://api:8000
      RC_DEFAULT_COURSE_ID: ${RC_DEFAULT_COURSE_ID:-robotics-expert}
      RC_API_TIMEOUT_MS: ${RC_API_TIMEOUT_MS:-10000}
      # Same two values as the api: RC_PUBLIC_CONTENT gates indexing here, and RC_PUBLIC_URL
      # is the base of every canonical link, hreflang alternate and sitemap entry. Passing
      # them to only one service leaves the two disagreeing (ADR 0016, RUNBOOK §8.2).
      RC_PUBLIC_CONTENT: ${RC_PUBLIC_CONTENT:-0}
      RC_PUBLIC_URL: ${RC_PUBLIC_URL:-http://localhost:3000}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    # The image's own HEALTHCHECK probes http://127.0.0.1:3000/ with node's fetch.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Same hardening as the api (SRV-09). Next needs its fetch cache writable, so that one
    # path is a tmpfs; verified by running the image read-only.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

volumes:
  rc-data:
  dbdata:
