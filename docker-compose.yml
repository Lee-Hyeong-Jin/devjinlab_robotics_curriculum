# Phase 1: the rc CLI. Phase 2 adds services step by step (harness/roadmap.yaml P2-5).
# Usage: docker compose run --rm cli validate
#        docker compose up -d db      # PostgreSQL for server mode (P2-3, docs/adr/0007)
#        export RC_DATABASE_URL=postgresql://rc:rc-dev-only@localhost:5432/rc
#        uv run alembic upgrade head
#        docker compose up -d --wait api   # db -> migrate -> api (bash scripts/smoke.sh)
# `web` and the reverse proxy follow with P2-4 (docs/architecture/operations.md).
# The db password below is a development default; production compose (P2-5) uses
# POSTGRES_PASSWORD_FILE with a Docker secret instead (docs/architecture/operations.md).
services:
  # One-shot tool, not part of `up`: docker compose run --rm cli validate
  cli:
    profiles: ["cli"]
    build: .
    image: robotics-curriculum:local
    volumes:
      - rc-data:/data
      - ./curriculum:/app/curriculum:ro

  db:
    image: postgres:16.13
    environment:
      POSTGRES_DB: rc
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: ${RC_DB_PASSWORD:-rc-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. Same image as api, alembic instead of rc.
  migrate:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:-rc-dev-only}@db:5432/rc
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    environment:
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:-rc-dev-only}@db:5432/rc
      RC_API_LOG_LEVEL: ${RC_API_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rc-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image carries no curl/wget, so probe with the interpreter that is already there.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/readyz", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Scheduled backup for hosts without the repository checked out (cron, systemd timer):
  #   docker compose run --rm backup
  # Interactive use goes through scripts/ops/backup.sh, which also prunes old dumps.
  backup:
    profiles: ["ops"]
    image: postgres:16.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec pg_dump -Fc -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > "/backups/rc-$$(date -u +%Y%m%dT%H%M%SZ).dump"'
    environment:
      POSTGRES_USER: rc
      POSTGRES_DB: rc
      PGPASSWORD: ${RC_DB_PASSWORD:-rc-dev-only}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Frontend (P2-4/P2-5). Appended after `backup` on purpose: the api/db block is being
  # hardened in another branch, and keeping the web block at the end keeps the merge clean.
  # Server-rendered Next.js, so it needs the api reachable, not a build-time URL.
  web:
    build:
      context: .
      target: web
    image: robotics-curriculum-web:local
    environment:
      # Inside the compose network the api answers on its service name.
      RC_API_BASE_URL: http://api:8000
      RC_DEFAULT_COURSE_ID: ${RC_DEFAULT_COURSE_ID:-robotics-expert}
      RC_API_TIMEOUT_MS: ${RC_API_TIMEOUT_MS:-10000}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    # The image's own HEALTHCHECK probes http://127.0.0.1:3000/ with node's fetch.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Not read_only yet: Next writes its fetch cache under .next/cache at runtime and that
    # has not been proven with a writable tmpfs here. Turn it on once scripts/smoke.sh
    # exercises the web service (it does not yet).

volumes:
  rc-data:
  dbdata:
