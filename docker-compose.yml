# Phase 1: the rc CLI. Phase 2 adds services step by step (harness/roadmap.yaml P2-5).
# Usage: export RC_DB_PASSWORD=... RC_AUTH_SECRET=...   # required (RUNBOOK §8)
#        docker compose run --rm cli validate
#        docker compose up -d db      # PostgreSQL for server mode (P2-3, docs/adr/0007)
#        docker compose up -d --wait api   # db -> migrate -> api (bash scripts/smoke.sh)
# `web` and the reverse proxy follow with P2-4 (docs/architecture/operations.md).
# Secrets have no defaults: compose refuses to start until they are set (server review SRV-06).
# The api runs in server mode (accounts, sessions; SRV-01) on a read-only root filesystem with
# no Linux capabilities (SRV-09). Production can swap the env values for Docker secrets.
services:
  # One-shot tool, not part of `up`: docker compose run --rm cli validate
  cli:
    profiles: ["cli"]
    build: .
    image: robotics-curriculum:local
    volumes:
      - rc-data:/data
      - ./curriculum:/app/curriculum:ro

  db:
    image: postgres:16.13
    environment:
      POSTGRES_DB: rc
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: ${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot schema migration. Same image as api, alembic instead of rc.
  migrate:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    entrypoint: ["alembic"]
    command: ["upgrade", "head"]
    environment:
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}@db:5432/rc
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: robotics-curriculum-api:local
    environment:
      RC_AUTH_MODE: server
      RC_DATABASE_URL: postgresql://rc:${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}@db:5432/rc
      RC_AUTH_SECRET: ${RC_AUTH_SECRET:?set RC_AUTH_SECRET (see docs/operations/RUNBOOK.md §8)}
      RC_AUTH_ADMIN_EMAIL: ${RC_AUTH_ADMIN_EMAIL:-}
      RC_AUTH_COOKIE_SECURE: ${RC_AUTH_COOKIE_SECURE:-1}
      RC_PUBLIC_URL: ${RC_PUBLIC_URL:-http://localhost:3000}
      RC_OIDC_PROVIDERS: ${RC_OIDC_PROVIDERS:-}
      RC_SMTP_HOST: ${RC_SMTP_HOST:-}
      RC_SMTP_PORT: ${RC_SMTP_PORT:-587}
      RC_SMTP_USER: ${RC_SMTP_USER:-}
      RC_SMTP_PASSWORD: ${RC_SMTP_PASSWORD:-}
      RC_SMTP_FROM: ${RC_SMTP_FROM:-}
      RC_API_LOG_LEVEL: ${RC_API_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rc-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The image carries no curl/wget, so probe with the interpreter that is already there.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://localhost:8000/readyz", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Scheduled backup for hosts without the repository checked out (cron, systemd timer):
  #   docker compose run --rm backup
  # Interactive use goes through scripts/ops/backup.sh, which also prunes old dumps.
  backup:
    profiles: ["ops"]
    image: postgres:16.13
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'exec pg_dump -Fc -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" > "/backups/rc-$$(date -u +%Y%m%dT%H%M%SZ).dump"'
    environment:
      POSTGRES_USER: rc
      POSTGRES_DB: rc
      PGPASSWORD: ${RC_DB_PASSWORD:?set RC_DB_PASSWORD (see docs/operations/RUNBOOK.md §8)}
    volumes:
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  rc-data:
  dbdata:
