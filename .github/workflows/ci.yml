name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # PostgreSQL for the store contract tests (P2-3). tests/conftest.py uses RC_TEST_DATABASE_URL
    # when set, so CI needs neither Docker-in-Docker nor testcontainers. Keep the image in step
    # with the `db` service in docker-compose.yml.
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_DB: rc
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: rc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc -d rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      RC_TEST_DATABASE_URL: postgresql://rc:rc-ci-only@localhost:5432/rc
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml

      - name: Validate curriculum
        run: uv run rc validate

      # Into the runner's own temp dir: `rc site build` refuses a non-empty directory that no
      # previous build marked with .rc-site, and /tmp is shared with whatever else runs here.
      - name: Build static site
        run: uv run rc site build --out "$RUNNER_TEMP/site"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Server mode end to end: build the api image, run db -> migrate -> api, probe the endpoints
  # (P2-5 / AC-OPS.2). Separate from `check` because it needs the Docker daemon, not uv.
  smoke:
    name: compose smoke (server mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Compose smoke test
        run: bash scripts/smoke.sh

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-compose-logs
          path: /tmp/rc-smoke-compose.log
          if-no-files-found: ignore

  # Frontend (P2-4, web/). Node 22 LTS is the baseline, 26 runs alongside it. Every step is
  # skipped until web/package.json exists, so this job is green before the frontend lands.
  web:
    name: web (node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Format check
        working-directory: web
        run: npm run format:check

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build

      # The generated client types must match docs/api/openapi.yaml. Regenerating them here
      # catches a schema change that landed without `npm run api:types` (contract drift).
      - name: API types are in step with the OpenAPI schema
        working-directory: web
        run: |
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts

  # Playwright smoke + axe accessibility pass (AC-WEB.1, AC-A11Y.1) against the real API and a
  # production build of the web app. One Node version: this is about the app, not the runtime.
  e2e:
    # Two suites, two API modes (web/README.md): smoke walks the read screens against a local
    # mode API (no login), journey signs up and walks AC-WEB.1 end to end against a server mode
    # API. Running one suite against the other's mode fails by design, so they are separate legs.
    name: e2e (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            auth_mode: local
            cookie_secure: "1"
            e2e_auth: ""
          - suite: journey
            auth_mode: server
            # The browser talks to the app over plain http, so the session cookie cannot be Secure.
            cookie_secure: "0"
            e2e_auth: "1"
    env:
      RC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci --prefix web

      - name: Install the chromium browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start the API (${{ matrix.auth_mode }} mode)
        env:
          RC_AUTH_MODE: ${{ matrix.auth_mode }}
          RC_AUTH_COOKIE_SECURE: ${{ matrix.cookie_secure }}
          RC_AUTH_SECRET: e2e-${{ github.run_id }}-${{ matrix.suite }}
        run: |
          # A throwaway data directory per leg: the journey suite creates accounts and progress.
          export RC_DATA_DIR="$(mktemp -d)"
          uv run rc api serve --host 127.0.0.1 --port 8000 --log-level warning \
            >"$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS --max-time 2 http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8000/healthz

      - name: Build the web app
        working-directory: web
        run: npm run build

      # playwright.config.ts starts `npm run start` itself and waits for the port.
      - name: Playwright (${{ matrix.suite }})
        working-directory: web
        env:
          E2E_AUTH: ${{ matrix.e2e_auth }}
        run: npx playwright test ${{ matrix.suite }}

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.suite }}
          path: web/playwright-report/
          if-no-files-found: ignore

      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  # Keeps the backup/restore tooling honest: back up, destroy the data, restore, verify
  # (P2-5 / AC-OPS.4). The release drill is run by hand and recorded in docs/ops/restore-drills.md;
  # here the record is thrown away with the runner.
  restore-drill:
    name: backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore drill
        run: bash scripts/ops/restore_drill.sh

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
