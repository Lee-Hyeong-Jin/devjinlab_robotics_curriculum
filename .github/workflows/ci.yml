name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # PostgreSQL for the store contract tests (P2-3). tests/conftest.py uses RC_TEST_DATABASE_URL
    # when set, so CI needs neither Docker-in-Docker nor testcontainers. Keep the image in step
    # with the `db` service in docker-compose.yml.
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_DB: rc
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: rc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc -d rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      RC_TEST_DATABASE_URL: postgresql://rc:rc-ci-only@localhost:5432/rc
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml

      - name: Validate curriculum
        run: uv run rc validate

      - name: Build static site
        run: uv run rc site build --out /tmp/site

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
