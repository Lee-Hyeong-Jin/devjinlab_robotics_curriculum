name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    # PostgreSQL for the store contract tests (P2-3). tests/conftest.py uses RC_TEST_DATABASE_URL
    # when set, so CI needs neither Docker-in-Docker nor testcontainers. Keep the image in step
    # with the `db` service in docker-compose.yml.
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_DB: rc
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: rc-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rc -d rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      RC_TEST_DATABASE_URL: postgresql://rc:rc-ci-only@localhost:5432/rc
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest with coverage
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml

      - name: Validate curriculum
        run: uv run rc validate

      # Into the runner's own temp dir: `rc site build` refuses a non-empty directory that no
      # previous build marked with .rc-site, and /tmp is shared with whatever else runs here.
      - name: Build static site
        run: uv run rc site build --out "$RUNNER_TEMP/site"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  # Server mode end to end: build the api image, run db -> migrate -> api, probe the endpoints
  # (P2-5 / AC-OPS.2). Separate from `check` because it needs the Docker daemon, not uv.
  smoke:
    name: compose smoke (server mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Compose smoke test
        run: bash scripts/smoke.sh

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-compose-logs
          path: /tmp/rc-smoke-compose.log
          if-no-files-found: ignore

  # Frontend (P2-4, web/). Node 22 LTS is the baseline, 26 runs alongside it. Every step is
  # skipped until web/package.json exists, so this job is green before the frontend lands.
  web:
    name: web (node${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "26"]
    steps:
      - uses: actions/checkout@v7

      - name: Is there a frontend yet?
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "web/package.json not present yet - skipping the frontend checks"
          fi

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run lint

      - name: Format check
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run format:check

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: npm run build

  # Keeps the backup/restore tooling honest: back up, destroy the data, restore, verify
  # (P2-5 / AC-OPS.4). The release drill is run by hand and recorded in docs/ops/restore-drills.md;
  # here the record is thrown away with the runner.
  restore-drill:
    name: backup and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Restore drill
        run: bash scripts/ops/restore_drill.sh

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
