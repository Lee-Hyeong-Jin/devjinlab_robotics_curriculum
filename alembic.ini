# Alembic config for the PostgreSQL progress store (docs/adr/0007-postgres-store.md).
# The migration scripts ship inside the package (robotics_curriculum/progress/migrations) so an
# installed `robotics-curriculum[postgres]` can migrate too. The URL comes from $RC_DATABASE_URL;
# never put credentials in this file.
#   RC_DATABASE_URL=postgresql://rc:...@localhost:5432/rc uv run alembic upgrade head
#   uv run alembic downgrade base
[alembic]
script_location = robotics_curriculum.progress:migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
