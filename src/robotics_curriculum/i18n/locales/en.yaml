# English message catalogue. Keys mirror ko.yaml (the source language); a key missing here
# falls back to Korean. Values are str.format templates with named parameters only.

cli:
  error_prefix: "error: {message}"
  warn_prereq: "warning: prerequisites not done: {ids}"
  timer:
    none: "Running timer: none"
    running: "Running timer: {lesson_id} (since {since} UTC)"
  review_line: "Due today: {due} cards · quiz accuracy (7 days): {rate}"
  no_record: "no records yet"
  status:
    header_module: "module"
    header_lesson: "lesson"
    header_title: "title"
    header_state: "state"
    header_time: "time"
    header_estimate: "est"
    header_completed: "completed"
    header_index: "#"
    header_difficulty: "difficulty"
    course_line: "{title} ({course_id})  {percent}%  ({done}/{total} lessons, time {time})"
  state:
    done: "done"
    in_progress: "in progress"
    not_started: "not started"
    locked: "locked"
  start: "started {lesson_id} ({title}) at {at} UTC"
  stop: "stopped {lesson_id}: {time}"
  stop_discarded: "discarded session for {lesson_id}"
  logged: "logged {time} on {lesson_id}"
  done_line: "done {lesson_id} ({title}), time {time}{extra}"
  done_understanding: ", understanding {value}"
  unlocked: "  unlocked: {lesson_id} ({title})"
  next:
    empty: "nothing to do: every available lesson is done"
    hint: "start: rc start {lesson_id}"
  export: "exported {lessons} lesson rows, {sessions} sessions to {path}"
  import: "imported {lessons} lesson rows, {sessions} sessions"

quiz:
  intro: "Quiz: {title} ({lesson_id}) — {count} questions"
  nothing_to_ask: "nothing to ask (every question was correct last time)"
  aborted: "aborted: nothing was saved"
  new_cards: "{count} new card(s) ({detail}) → review them with `rc review`"
  new_cards_detail: "{wrong} wrong + {concept} concept"
  elapsed: "took {time} · saved"
  question: "[{number}/{total}] ({kind}) {prompt}"
  correct: "correct"
  wrong: "wrong (answer: {answer})"
  explanation: "  why: {text}"
  score: "score {correct}/{total} ({percent}%)  wrong {wrong}"
  kind:
    single: "single choice"
    multiple: "multiple choice"
    truefalse: "true/false"
    short: "short answer"
  hint:
    single: "number"
    multiple: "numbers (comma separated)"
    truefalse: "O/X"
    short: "answer"
  invalid:
    need_number: "enter a number (1-{count})"
    not_in_range: "'{token}' is not a number between 1 and {count}"
    truefalse: "answer with O or X"
    one_number: "pick exactly one number"
    need_answer: "enter an answer"

review:
  none_due: "no cards are due today"
  due_count: "{count} card(s) due"
  session_intro: "Reviewing {count} card(s)"
  rating_menu: "1 again · 2 hard · 3 good · 4 easy"
  rating_invalid: "  ! answer with 1-4 or again/hard/good/easy"
  front: "[{shown}/{total}]"
  front_again: "[again {pass_no}/{max_pass}]"
  reveal: "> press Enter for the back "
  back: "  answer: {text}"
  next_due: "  next review: {date} (in {days} day(s))"
  summary: "reviewed {reviewed}  {ratings}   due tomorrow {tomorrow}"
  aborted: "aborted: the cards answered so far were saved"
  header:
    card: "card"
    lesson: "lesson"
    source: "source"
    due: "due"

