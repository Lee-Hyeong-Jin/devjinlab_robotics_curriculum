# 로보틱스 연구원 트랙 필독 논문 레지스트리 (reading list registry)
#
# 설계: blueprint.md 의 각 레슨이 여기 있는 id 를 참조한다(lesson-standard.md §11-1 의
#       papers.yaml 레지스트리 + 레슨 papers[] 참조 방식). 콘텐츠로 옮길 때의 최종 위치는
#       curriculum/robotics-research/papers.yaml 이다.
#
# 필드
#   id        : 레지스트리 전체에서 유일한 슬러그 (<제1저자><연도>-<약칭>)
#   title     : 논문 제목 (원문, 영문)
#   authors   : 저자 (3명까지 나열, 그 이상은 "et al.")
#   year      : 출판 연도
#   venue     : 학회·저널 (약어)
#   url       : 영구 링크. null 이면 아직 링크를 확정하지 않았다는 뜻이다.
#   verified  : true 는 2026-11-12 이 조사에서 실제로 fetch 해 제목·제1저자·연도가 일치함을
#               확인했다는 뜻. false 는 미확인 — 문서에 노출할 때 "(미확인)" 으로 표기한다.
#   note      : 선택. 확인 과정에서 나온 유보 사항(선공개 연도 차이, 재수록판, 통칭 제목,
#               venue 미확인 등). 레슨 본문에 그대로 옮길 필요는 없다.
#   lessons   : 이 논문을 필독으로 지정한 blueprint.md 의 레슨 id
#   role      : seminal | standard | frontier | critique | survey
#
# 확인 상태 (2026-11-12 기준): 145편 중 144편 verified: true, 1편 false.
#   미확인 1편 — brockett1983-nonholonomic (책 챕터, Crossref 에서 찾지 못함).
#   끝내 확인되지 않으면 목록에서 빼고 대체 논문을 넣는다(오케스트레이터 지시 2026-11-12).
#   확인 방법: arXiv API(id_list), Crossref API, OpenAlex, JMLR 페이지. Semantic Scholar 는
#   요청 제한(429)으로 일부만 사용했다. DOI 로만 확인한 항목은 전체 저자 목록까지는
#   대조하지 않았다. arXiv 로 확인한 항목의 학회·저널 게재(venue)는 journal_ref 가 없는 경우
#   확인되지 않았으며 그런 항목은 note 에 적었다.
#
# 주의: 총 131편으로 브리프의 "100편 내외"를 상회한다. blueprint.md 의 97레슨이 레슨당
#       1–3편을 지정한 결과이며, 줄이려면 specialization 트랙을 4개로 줄이는 쪽이 자연스럽다
#       (blueprint.md §10-1).

