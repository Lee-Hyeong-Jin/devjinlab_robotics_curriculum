  est_hours: null
  last_updated: 2025-09
  status: active
  license: Apache-2.0
  quality_signal: ~1.6k GitHub stars, 523 forks; de-facto ROS 2 simulator with the largest tutorial ecosystem; only 'a handful of people' make regular core contributions (Gazebo team, Mar 2025)
  notes: 'Current LTS lines: Harmonic (Sep 2023-May 2029, pairs with ROS 2 Jazzy) and Jetty (Sep 2025-May 2031, pairs with Lyrical/Rolling); Ionic (pairs with Kilted) reaches EOL Dec 2026; next release ''M'' planned Mar 2027. Ogre2 renderer needs OpenGL 3.3 and real GPU drivers; Windows requires server and GUI in separate terminals; no official minimum-hardware page found; ''no turn-key RL example''. Beware: most web tutorials still target Gazebo Classic, which cannot coexist with Harmonic. (level 추정)'
  source_checked_date: '2026-11-11'
  extra:
    recommended_pairing_2026: ROS 2 Jazzy + Gazebo Harmonic on Ubuntu 24.04 (both LTS to 2029)
    release_table: Rotary (rolling); M Mar 2027-Dec 2028; Jetty Sep 2025-May 2031 LTS; Ionic Sep 2024-Dec 2026; Harmonic Sep 2023-May 2029 LTS; Garden EOL Nov 2024; Fortress Sep 2021-May 2027 LTS; Citadel EOL Dec 2024
    ros2_pairing: Lyrical->Jetty, Kilted->Ionic, Jazzy->Harmonic, Humble->Fortress (Harmonic possible with effort), Rolling->Rotary
    pairing_conflicts: ros_gz README lists Lyrical with Harmonic (source-only) vs official page Lyrical->Jetty; Jetty EOL May 2031 (release notes) vs Sep 2030 (Discourse announcement)
    install: sudo apt-get install ros-${ROS_DISTRO}-ros-gz (vendor packages shipped from ROS repo since Jazzy)
    os_support: Ubuntu Noble first-class; macOS via Homebrew; Windows partial
    min_gpu: OpenGL 3.3 (Ogre2); no official spec page found
    wsl: Harmonic works under WSLg with GPU (user report); one WSL2 user got a black GUI with Ogre2
    headless: requires OGRE2 and --headless-rendering on Harmonic
    python_api: 'limited: TestFixture class, PythonSystemLoader, gz.math/gz.sim helpers; PYTHONPATH setup needed'
    ros2_support: ros_gz bridge, first-class
    physics_engines: swappable physics engines / physics plugins
