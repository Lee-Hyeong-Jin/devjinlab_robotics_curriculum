  topics:
  - webots
  - mobile-robot
  - manipulator
  - python-api
  - ros2
  - education
  est_hours: null
  last_updated: 2025-01
  status: active
  license: Apache-2.0
  quality_signal: ~4.8k GitHub stars, ~2.1k forks; community on Discord, GitHub issues, Stack Overflow (webots tag)
  notes: Stable release R2025a (Jan 31, 2025; ~21 months old) with nightly R2025b/R2026 builds from master; lowest hardware floor of the 3D simulators here (2 GB RAM, OpenGL 3.3) but Intel integrated graphics are 'not recommended' and only NVIDIA is recommended on Linux. Next release name (R2025b vs R2026a) is unconfirmed; pin R2025a in course material. Physics engine is ODE-based; smaller community than Gazebo, less photorealism/GPU-RL than Isaac.
  source_checked_date: '2026-11-11'
  extra:
    version: R2025a
    release_date: '2025-01-31'
    nightly_builds: yes (master, may be unstable; latest 2026-11-10)
    os_support: Ubuntu 22.04/24.04/26.04 (x86-64), Windows 10/11 64-bit, macOS 12/13/14
    min_cpu: 2 GHz dual-core (quad-core recommended)
    min_ram_gb: 2
    min_gpu: NVIDIA or AMD with OpenGL 3.3+, >=512 MB VRAM (Intel iGPU not recommended)
    wsl_vm_apple_silicon: no official statement found
    python_api: controller module, Python >= 3.8, ~25 classes / ~200 functions
    ros2_support: webots_ros2 2025.0.1 (Jazzy apt package, Kilted support); ROS 1 removed in R2025a
    matlab_controllers: true
    physics_engine: ODE
    docs_url: https://cyberbotics.com/doc/guide/system-requirements
    r2025a_changes: Clearpath Heron USV, X3D->W3D web format, Lua PROTO removed, ROS 1 removed, Ubuntu 20.04/macOS 11 dropped
