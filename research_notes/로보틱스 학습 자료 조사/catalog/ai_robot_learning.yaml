  quality_signal: authoritative first-party sizing guide
  notes: 'Indicative VRAM at BS 8: light BC (act/vqbet/tdmpc) 2-6 GB (RTX 3060/L4/A10G); Diffusion 8-14 GB (RTX 4070+); SmolVLA 10-16 GB (RTX 4080+); large VLA (pi0/pi0_fast/pi05/xvla/wall_x) and multimodal (groot/eo1) 24-40 GB (A100 40 GB+, ''24 GB tight at BS 1''). Wall-clock for 5 epochs on ~50 episodes: ACT 30-60 min on 4090/3090, Diffusion 2-4 h, SmolVLA 3-6 h on L4 or 1-2 h on A100, pi0/pi05 4-8 h on A100, ACT on Apple MPS 6-14 h; ''CPU only — Don''t train''. IL typically converges in 5-10 epochs. HF Jobs flavors t4/l4/a10g/a100 billed by the second. (level 추정)'
